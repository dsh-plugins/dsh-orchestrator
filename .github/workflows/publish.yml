name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to publish. Leave blank for a build check.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - name: Validate the requested tag
        if: env.RELEASE_TAG != ''
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Pack the tested package
        run: |
          commit="$(git rev-parse HEAD)"
          npm pkg set "gitHead=$commit"
          mkdir "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
          mv "$RUNNER_TEMP"/npm-package/*.tgz "$RUNNER_TEMP/release.tgz"
          tar -xzf "$RUNNER_TEMP/release.tgz" -C "$RUNNER_TEMP/npm-package"
          cd "$RUNNER_TEMP/npm-package/package"
          node -e "require('node:fs').accessSync(require('./package.json').dsh.bundle.patch)"
          test "$commit" = "$(node -p 'require("./package.json").gitHead')"
      - name: Publish the tested stable tag
        if: env.RELEASE_TAG != ''
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require(process.env.RUNNER_TEMP + '/npm-package/package/package.json').version")"
          npm publish "$RUNNER_TEMP/release.tgz" --access public --registry https://registry.npmjs.org
